[project]
name = "backend"
version = "0.1.0"
description = "Trainy training planner backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "fastapi>=0.136.3",
    "pydantic>=2.13.4",
    "sqlmodel>=0.0.38",
    "uvicorn[standard]>=0.48.0",
    "requests>=2.32.0",
    "curl-cffi>=0.7.0",
    "cryptography>=48.0.0",
    "sqlalchemy[asyncio]>=2.1.6",
]

[dependency-groups]
dev = ["httpx2>=2.12.0", "pytest>=8", "ruff>=0.15.14", "ty>=0.0.41"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]
